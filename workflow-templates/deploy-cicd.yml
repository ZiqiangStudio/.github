name: CI/CD

on:
  pull_request:
  push:
    branches: [$default-branch]

permissions:
  contents: read
  packages: write
  deployments: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ZiqiangStudio/zq-deploy/.github/workflows/reusable-container.yml@main
    secrets: inherit
    with:
      domain: REPLACE_ME_WITH_YOUR_DOMAIN
      port: 8000
