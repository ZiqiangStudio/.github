name: CI/CD

on:
  pull_request:
  push:
    branches: [$default-branch]

permissions:
  contents: read
  packages: write
  deployments: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ZiqiangStudio/zq-deploy/.github/workflows/reusable-container.yml@main
    secrets: inherit
    with:
      domain: "" # 上线时填入分配给本服务的公网域名，多个用逗号隔开，例如 score.ziqiang.net.cn
      port: 8000
